apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-image
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: nirmalkanniaiyan/serverimage:v3
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "900m"
            memory: "768Mi"