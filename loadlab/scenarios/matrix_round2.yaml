# Round 2 of the loadlab dataset (run with runner/matrix.py --matrix scenarios/matrix_round2.yaml).
#
# Why: round 1 (scenarios/matrix.yaml) has exactly one injection of error_rate, cpu_hog, bad_deploy and
# crashloop, so leave-run-out evaluation is impossible for those classes, and the HPA never scales in
# (default 300 s scale-down stabilisation). Round 2 adds a second (and third) independent run of every
# class with DIFFERENT parameters / seeds / pods / replica counts from round 1, HPA runs with a 30 s
# scale-down window so scale-in exists, and a solo capacity run to settle the replica-dependent knee.
#
# Ids keep the round-1 group prefixes (a-/b-/c-/d-) so runner/qa_dataset.py applies the same checks,
# and end in -r2. `round` is added to the dataset by runner/build_dataset.py.
#
# Capacity reference: 1 pod ~ 17.8 RPS throughput ceiling (25 ms CPU / request at a 500m limit); the
# p95 knee is 20 / 18 / 16 RPS per pod for 1 / 2 / 3 replicas (QA_REPORT). base_load_pods x 18 RPS.
# Lane budget as round 1: 2 lanes, 4 app pods max per lane; `heavy` runs never overlap; `solo` runs only
# with --lanes 1 (node to themselves).
runs:
  # ------------------------------------------------------------------ A. capacity, alone on the node
  - id: a-cap-fixed2-solo-r2
    group: A
    heavy: true
    solo: true
    duration_s: 600
    # 16 -> 44 RPS in 2-RPS steps = 8 -> 22 RPS/pod in 1-RPS/pod steps (round 1 had 2-RPS/pod steps with
    # an HPA lane running next to it). Answers: is the 2-replica knee at 18 RPS/pod real or cross-lane noise?
    traffic: {shape: step_ramp, base_rps: 16, params: {start_rps: 16, step_rps: 2, step_s: 40, ramp_s: 3}}
    scaling: {policy: fixed, replicas: 2}
    faults: []

  # ------------------------------------------------------------------ B. HPA with 30 s scale-down window
  - id: b-hpa-diurnal-sd30-s41-r2
    group: B
    heavy: false
    duration_s: 780
    traffic: {shape: diurnal, base_load_pods: 1.2, params: {period_s: 360, amplitude: 0.65, noise: 0.08, seed: 41}}  # ~7.6-35.6 RPS
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, scale_down_window_s: 30}
    faults: []
  - id: b-hpa-diurnal-sd30-s59-r2
    group: B
    heavy: false
    duration_s: 780
    traffic: {shape: diurnal, base_load_pods: 0.9, params: {period_s: 300, amplitude: 0.55, noise: 0.10, seed: 59}}  # ~7.3-25 RPS
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, scale_down_window_s: 30}
    faults: []
  - id: b-hpa-saw-sd30-b12-r2
    group: B
    heavy: false
    duration_s: 720
    traffic: {shape: sawtooth, base_load_pods: 1.2, params: {period_s: 240, low_mult: 0.4, high_mult: 1.8}}  # 8.6 -> 38.9 RPS
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, scale_down_window_s: 30}
    faults: []
  - id: b-hpa-spike-sd30-b06-r2
    group: B
    heavy: true
    duration_s: 600
    traffic: {shape: spike, base_load_pods: 0.6, params: {spike_at_s: 150, spike_mult: 4, spike_s: 150, ramp_s: 8}}  # 10.8 -> 43.2 RPS
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, scale_down_window_s: 30}
    faults: []

  # ------------------------------------------------------------------ C. fixed under / over provisioned
  - id: c-under-fixed1-flash-r2
    group: C
    heavy: true
    duration_s: 480
    traffic: {shape: flash_crowd, base_load_pods: 0.6, params: {at_s: 150, mult: 2.5, ramp_s: 5}}  # 10.8 -> 27 RPS on 1 pod
    scaling: {policy: fixed, replicas: 1}
    faults: []
  - id: c-over-fixed4-diurnal-r2
    group: C
    heavy: false
    duration_s: 600
    traffic: {shape: diurnal, base_load_pods: 0.4, params: {period_s: 300, amplitude: 0.5, noise: 0.08, seed: 13}}  # 3.6-10.8 RPS on 4 pods
    scaling: {policy: fixed, replicas: 4}
    faults: []

  # ------------------------------------------------------------------ D. single faults (params differ from round 1)
  - id: d-error10-hpa-diurnal-r2
    group: D
    heavy: false
    duration_s: 600
    traffic: {shape: diurnal, base_load_pods: 0.9, params: {period_s: 400, amplitude: 0.3, noise: 0.06, seed: 17}}
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, initial: 3}
    faults:
      - {type: error_rate, start_s: 240, end_s: 450, target: all, params: {error_rate: 0.10}}
  - id: d-error30-fixed3-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_rps: 15}
    scaling: {policy: fixed, replicas: 3}
    faults:
      - {type: error_rate, start_s: 180, end_s: 360, target: all, params: {error_rate: 0.30}}
  - id: d-cpu-hog-fixed3-p0-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_rps: 13}
    scaling: {policy: fixed, replicas: 3}
    faults:   # 350m burner in pod 0 (round 1: 450m, pod 0, under HPA)
      - {type: cpu_hog, start_s: 180, end_s: 390, target: one-pod, pod_index: 0, params: {cpu_hog_millicores: 350}}
  - id: d-cpu-hog-fixed3-p2-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_rps: 16}
    scaling: {policy: fixed, replicas: 3}
    faults:   # 480m burner in pod 2: the target pod saturates, deployment p95 rises; more replicas would not fix it
      - {type: cpu_hog, start_s: 150, end_s: 360, target: one-pod, pod_index: 2, params: {cpu_hog_millicores: 480}}
  - id: d-bad-deploy-x2-hpa-r2
    group: D
    heavy: false
    duration_s: 600
    traffic: {shape: steady, base_rps: 16}
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, initial: 3}
    faults:   # CPU_MS_PER_REQ 25 -> 50 (x2); the HPA can absorb it within the 4-pod cap; rollback at 420
      - {type: bad_deploy, start_s: 200, end_s: 420, params: {cpu_ms_per_req: 50}}
  - id: d-bad-deploy-x3-fixed3-r2
    group: D
    heavy: true
    duration_s: 600
    traffic: {shape: steady, base_rps: 15}
    scaling: {policy: fixed, replicas: 3}
    faults:   # 25 -> 75 (x3) on fixed 3 pods: ~20 RPS ceiling vs 15 offered, throttled; rollback at 400
      - {type: bad_deploy, start_s: 180, end_s: 400, params: {cpu_ms_per_req: 75, version: v3-bad}}
  - id: d-crashloop-fixed3-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_rps: 14}
    scaling: {policy: fixed, replicas: 3}
    faults:
      - {type: crashloop, start_s: 150, end_s: 390}
  - id: d-dep-latency-25p300-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_rps: 15}
    scaling: {policy: fixed, replicas: 3}
    faults:
      - {type: dep_latency, start_s: 180, end_s: 390, target: all, params: {dep_latency_ms: 300, dep_fraction: 0.25}}
  - id: d-dep-latency-75p600-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_load_pods: 1.0}
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, initial: 3}
    faults:
      - {type: dep_latency, start_s: 150, end_s: 390, target: all, params: {dep_latency_ms: 600, dep_fraction: 0.75}}
  - id: d-leak-fast-oom-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_rps: 15}
    scaling: {policy: fixed, replicas: 3}
    faults:   # 2 MB/s on pod 1: OOM roughly every ~110 s (repeated OOM), freed at end
      - {type: memory_leak, start_s: 120, end_s: 450, target: one-pod, pod_index: 1, params: {leak_kb_per_s: 2048, free_on_end: true}}
  - id: d-leak-medium-r2
    group: D
    heavy: false
    duration_s: 720
    traffic: {shape: diurnal, base_load_pods: 0.8, params: {period_s: 360, amplitude: 0.3, noise: 0.06, seed: 29}}
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, initial: 2}
    faults:   # 560 KB/s on pod 0: one OOM ~390 s after start, leaked memory retained (no free)
      - {type: memory_leak, start_s: 120, end_s: 630, target: one-pod, pod_index: 0, params: {leak_kb_per_s: 560}}
  - id: d-pod-kill-fixed2-r2
    group: D
    heavy: false
    duration_s: 540
    traffic: {shape: steady, base_rps: 16}
    scaling: {policy: fixed, replicas: 2}
    faults:   # with 2 pods a kill halves capacity for ~20-30 s
      - {type: pod_kill, start_s: 150, pod_index: 0}
      - {type: pod_kill, start_s: 330, pod_index: 1}
  - id: d-pod-kill-hpa-r2
    group: D
    heavy: false
    duration_s: 600
    traffic: {shape: steady, base_load_pods: 0.9}
    scaling: {policy: hpa_cpu, min: 1, max: 6, target_cpu: 70, initial: 3}
    faults:
      - {type: pod_kill, start_s: 140, pod_index: 2}
      - {type: pod_kill, start_s: 290, pod_index: 0}
      - {type: pod_kill, start_s: 440, pod_index: 1}
